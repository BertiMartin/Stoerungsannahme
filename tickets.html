<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ticket-System – Geräteservice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #181818;
  --surface2: #222222;
  --border: #2e2e2e;
  --border2: #3a3a3a;
  --red: #c0392b;
  --red-light: #e74c3c;
  --red-dim: rgba(192,57,43,0.15);
  --green: #1a6b3a;
  --green-light: #27ae60;
  --green-dim: rgba(39,174,96,0.15);
  --gold: #c9922a;
  --gold-dim: rgba(201,146,42,0.15);
  --blue: #1a4a7a;
  --blue-light: #2980b9;
  --blue-dim: rgba(41,128,185,0.15);
  --orange: #c0622b;
  --orange-light: #e67e22;
  --orange-dim: rgba(230,126,34,0.15);
  --text: #f0f0f0;
  --text2: #aaaaaa;
  --text3: #666666;
  --radius: 6px;
  --font-head: "Syne", sans-serif;
  --font-body: "DM Sans", sans-serif;
  --font-mono: "DM Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

/* ── Layout ── */
.app { display: flex; min-height: 100vh; }
.sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
.main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

/* ── Sidebar ── */
.sidebar-logo { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
.sidebar-logo h1 { font-family: var(--font-head); font-size: 1.1rem; font-weight: 800; color: var(--text); letter-spacing: 1px; }
.sidebar-logo span { font-size: 0.72rem; color: var(--text3); font-family: var(--font-mono); letter-spacing: 2px; text-transform: uppercase; }
.sidebar-nav { padding: 16px 0; flex: 1; overflow-y: auto; }
.nav-section { padding: 8px 20px 4px; font-size: 0.65rem; color: var(--text3); font-family: var(--font-mono); letter-spacing: 2px; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; cursor: pointer; font-size: 0.88rem; color: var(--text2); transition: all 0.15s; border-left: 2px solid transparent; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { color: var(--red-light); border-left-color: var(--red); background: var(--red-dim); }
.nav-item .badge { margin-left: auto; background: var(--red); color: #fff; font-size: 0.68rem; font-family: var(--font-mono); padding: 1px 6px; border-radius: 10px; min-width: 20px; text-align: center; }
.nav-item .badge.green { background: var(--green); }
.nav-item .badge.gold { background: var(--gold); }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text3); font-family: var(--font-mono); }

/* ── Topbar ── */
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 16px; }
.topbar-title { font-family: var(--font-head); font-size: 1.1rem; font-weight: 700; flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: var(--radius); border: none; cursor: pointer; font-family: var(--font-body); font-size: 0.85rem; font-weight: 500; transition: all 0.15s; }
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-light); }
.btn-outline { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
.btn-outline:hover { background: var(--surface2); color: var(--text); }
.btn-sm { padding: 5px 10px; font-size: 0.78rem; }
.btn-ghost { background: transparent; color: var(--text3); border: none; }
.btn-ghost:hover { color: var(--text); }

/* ── Content ── */
.content { padding: 24px 28px; flex: 1; }

/* ── Stats row ── */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.stat-card .stat-val { font-family: var(--font-head); font-size: 1.9rem; font-weight: 800; }
.stat-card .stat-label { font-size: 0.75rem; color: var(--text3); font-family: var(--font-mono); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
.stat-card.red { border-color: var(--red); background: var(--red-dim); }
.stat-card.red .stat-val { color: var(--red-light); }
.stat-card.gold .stat-val { color: var(--gold); }
.stat-card.blue .stat-val { color: var(--blue-light); }
.stat-card.green .stat-val { color: var(--green-light); }

/* ── Filters ── */
.filters { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; font-size: 0.8rem; font-family: var(--font-body); transition: all 0.15s; }
.filter-btn:hover { border-color: var(--red); color: var(--text); }
.filter-btn.active { background: var(--red); border-color: var(--red); color: #fff; }
.search-box { margin-left: auto; position: relative; }
.search-box input { background: var(--surface); border: 1px solid var(--border2); color: var(--text); padding: 7px 12px 7px 32px; border-radius: var(--radius); font-family: var(--font-body); font-size: 0.83rem; width: 220px; outline: none; }
.search-box input:focus { border-color: var(--red); }
.search-box::before { content: "🔍"; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 0.75rem; pointer-events: none; }

/* ── Ticket table ── */
.ticket-table { width: 100%; border-collapse: collapse; }
.ticket-table th { text-align: left; padding: 10px 14px; font-size: 0.7rem; font-family: var(--font-mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; }
.ticket-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: middle; }
.ticket-table tr:hover td { background: var(--surface2); }
.ticket-table tr.clickable { cursor: pointer; }
.ticket-id { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text3); }
.ticket-title-cell strong { display: block; margin-bottom: 2px; }
.ticket-title-cell span { font-size: 0.75rem; color: var(--text3); }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state p { font-size: 0.9rem; }

/* ── Badges ── */
.badge-status, .badge-prio { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 0.72rem; font-family: var(--font-mono); font-weight: 500; white-space: nowrap; }
.status-open { background: var(--blue-dim); color: var(--blue-light); }
.status-progress { background: var(--gold-dim); color: var(--gold); }
.status-closed { background: var(--green-dim); color: var(--green-light); }
.status-waiting { background: var(--orange-dim); color: var(--orange-light); }
.prio-low { background: #1a2a1a; color: #4caf50; }
.prio-medium { background: var(--gold-dim); color: var(--gold); }
.prio-high { background: var(--orange-dim); color: var(--orange-light); }
.prio-urgent { background: var(--red-dim); color: var(--red-light); }

/* ── Modal overlay ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto; }
.modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-header h2 { font-family: var(--font-head); font-size: 1.05rem; font-weight: 700; }
.modal-body { padding: 20px 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 0.78rem; color: var(--text2); margin-bottom: 6px; font-family: var(--font-mono); letter-spacing: 0.5px; }
.field label .req { color: var(--red-light); }
.field input, .field select, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--border2); color: var(--text); padding: 9px 12px; border-radius: var(--radius); font-family: var(--font-body); font-size: 0.88rem; outline: none; transition: border 0.15s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--red); }
.field textarea { resize: vertical; min-height: 90px; }
.field select option { background: var(--surface); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ── Ticket detail ── */
.ticket-detail { max-width: 860px; }
.detail-header { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 18px; }
.detail-header .detail-id { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text3); margin-bottom: 8px; }
.detail-header h2 { font-family: var(--font-head); font-size: 1.3rem; font-weight: 700; margin-bottom: 12px; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.detail-meta-item { font-size: 0.78rem; color: var(--text3); display: flex; align-items: center; gap: 4px; }
.detail-grid { display: grid; grid-template-columns: 1fr 320px; gap: 18px; }
.detail-main { display: flex; flex-direction: column; gap: 18px; }
.detail-side { display: flex; flex-direction: column; gap: 14px; }
.detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.detail-card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.72rem; font-family: var(--font-mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); display: flex; align-items: center; justify-content: space-between; }
.detail-card-body { padding: 16px; }
.detail-desc { font-size: 0.88rem; line-height: 1.7; color: var(--text2); white-space: pre-wrap; }
.info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.83rem; }
.info-row:last-child { border-bottom: none; }
.info-row .info-label { color: var(--text3); }
.info-row select { background: var(--bg); border: 1px solid var(--border2); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 0.78rem; font-family: var(--font-body); outline: none; cursor: pointer; }

/* ── Comments ── */
.comment { display: flex; gap: 12px; margin-bottom: 16px; }
.comment-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; flex-shrink: 0; font-family: var(--font-head); }
.comment-body { flex: 1; }
.comment-meta { font-size: 0.72rem; color: var(--text3); margin-bottom: 5px; font-family: var(--font-mono); }
.comment-text { font-size: 0.85rem; color: var(--text2); line-height: 1.6; background: var(--surface2); padding: 10px 12px; border-radius: var(--radius); }
.comment-input-area { display: flex; gap: 10px; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; }
.comment-input-area textarea { flex: 1; background: var(--bg); border: 1px solid var(--border2); color: var(--text); padding: 9px 12px; border-radius: var(--radius); font-family: var(--font-body); font-size: 0.85rem; resize: none; height: 70px; outline: none; }
.comment-input-area textarea:focus { border-color: var(--red); }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); padding: 12px 18px; border-radius: var(--radius); font-size: 0.85rem; z-index: 9999; animation: slideUp 0.2s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
@keyframes slideUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

@media (max-width: 900px) {
  .sidebar { width: 200px; }
  .main { margin-left: 200px; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .detail-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>🎫 TICKET-SYSTEM</h1>
      <span>Geräteservice</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Ansichten</div>
      <div class="nav-item active" onclick="showView('dashboard')" id="nav-dashboard">
        <span>📊</span> Dashboard
      </div>
      <div class="nav-item" onclick="showView('all')" id="nav-all">
        <span>📋</span> Alle Tickets
        <span class="badge" id="badge-all">0</span>
      </div>
      <div class="nav-section">Status</div>
      <div class="nav-item" onclick="showView('open')" id="nav-open">
        <span>🔵</span> Offen
        <span class="badge" id="badge-open">0</span>
      </div>
      <div class="nav-item" onclick="showView('progress')" id="nav-progress">
        <span>🟡</span> In Bearbeitung
        <span class="badge gold" id="badge-progress">0</span>
      </div>
      <div class="nav-item" onclick="showView('waiting')" id="nav-waiting">
        <span>🟠</span> Wartend
        <span class="badge" id="badge-waiting">0</span>
      </div>
      <div class="nav-item" onclick="showView('closed')" id="nav-closed">
        <span>🟢</span> Geschlossen
        <span class="badge green" id="badge-closed">0</span>
      </div>
      <div class="nav-section">Priorität</div>
      <div class="nav-item" onclick="showView('urgent')" id="nav-urgent">
        <span>🚨</span> Dringend
        <span class="badge" id="badge-urgent">0</span>
      </div>
    </nav>
    <div class="sidebar-footer">v1.0 · Geräteservice</div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="view-title">Dashboard</span>
      <button class="btn btn-outline btn-sm" onclick="exportAll()">📤 Exportieren</button>
      <button class="btn btn-primary" onclick="openNewTicket()">+ Neues Ticket</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- New Ticket Modal -->
<div class="modal-overlay" id="modal-new">
  <div class="modal">
    <div class="modal-header">
      <h2>Neues Ticket erstellen</h2>
      <button class="btn btn-ghost" onclick="closeModal('modal-new')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Titel <span class="req">*</span></label>
        <input type="text" id="new-title" placeholder="Kurze Beschreibung des Problems">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Priorität <span class="req">*</span></label>
          <select id="new-prio">
            <option value="low">🟢 Niedrig</option>
            <option value="medium" selected>🟡 Mittel</option>
            <option value="high">🟠 Hoch</option>
            <option value="urgent">🔴 Dringend</option>
          </select>
        </div>
        <div class="field">
          <label>Gerätetyp</label>
          <select id="new-device">
            <option value="">– Kein Gerät –</option>
            <option value="GL">Straßengerät (GL)</option>
            <option value="GS">Scherenbühne (GS)</option>
            <option value="GGGT">Gelenk- & Teleskopbühne (GG/GT)</option>
            <option value="GTSR">Rotorstapler (GTSR)</option>
            <option value="GTS">Teleskopstapler (GTS)</option>
            <option value="GST">Maststapler (GST)</option>
            <option value="URGENT">Dringende Meldung</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Kundenname <span class="req">*</span></label>
          <input type="text" id="new-customer" placeholder="Max Mustermann">
        </div>
        <div class="field">
          <label>Firma</label>
          <input type="text" id="new-company" placeholder="Musterfirma GmbH">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Einsatzort</label>
          <input type="text" id="new-location" placeholder="Berlin, Baustelle A">
        </div>
        <div class="field">
          <label>Telefon</label>
          <input type="text" id="new-phone" placeholder="+49 ...">
        </div>
      </div>
      <div class="field">
        <label>Zugewiesen an</label>
        <select id="new-assign">
          <option value="">– Nicht zugewiesen –</option>
          <option value="Techniker 1">Techniker 1</option>
          <option value="Techniker 2">Techniker 2</option>
          <option value="Techniker 3">Techniker 3</option>
          <option value="Disponent">Disponent</option>
        </select>
      </div>
      <div class="field">
        <label>Fehlerbeschreibung</label>
        <textarea id="new-desc" placeholder="Detaillierte Beschreibung des Fehlers / der Situation..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-new')">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveNewTicket()">Ticket erstellen</button>
    </div>
  </div>
</div>

<!-- Technician edit modal -->
<div class="modal-overlay" id="modal-tech">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <h2>Techniker verwalten</h2>
      <button class="btn btn-ghost" onclick="closeModal('modal-tech')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Neue Techniker hinzufügen (kommagetrennt)</label>
        <input type="text" id="tech-input" placeholder="z.B. Hans Müller, Anna Schmidt">
      </div>
      <div id="tech-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-tech')">Schließen</button>
      <button class="btn btn-primary" onclick="saveTechs()">Speichern</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let tickets = JSON.parse(localStorage.getItem('gs_tickets') || '[]');
let technicians = JSON.parse(localStorage.getItem('gs_technicians') || '["Techniker 1","Techniker 2","Techniker 3","Disponent"]');
let currentView = 'dashboard';
let currentTicketId = null;
let searchQuery = '';
let filterStatus = 'all';

// ── Helpers ────────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('gs_tickets', JSON.stringify(tickets));
  localStorage.setItem('gs_technicians', JSON.stringify(technicians));
}
function genId() {
  const n = (tickets.length + 1).toString().padStart(4, '0');
  return 'TK-' + n;
}
function now() { return new Date().toLocaleString('de-DE'); }
function dateStr(iso) {
  if (!iso) return '–';
  return new Date(iso).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

const STATUS_LABELS = { open:'Offen', progress:'In Bearbeitung', waiting:'Wartend', closed:'Geschlossen' };
const STATUS_CLASS  = { open:'status-open', progress:'status-progress', waiting:'status-waiting', closed:'status-closed' };
const PRIO_LABELS   = { low:'Niedrig', medium:'Mittel', high:'Hoch', urgent:'Dringend' };
const PRIO_CLASS    = { low:'prio-low', medium:'prio-medium', high:'prio-high', urgent:'prio-urgent' };
const PRIO_DOT      = { low:'🟢', medium:'🟡', high:'🟠', urgent:'🔴' };

function statusBadge(s) {
  return `<span class="badge-status ${STATUS_CLASS[s]||'status-open'}">${STATUS_LABELS[s]||s}</span>`;
}
function prioBadge(p) {
  return `<span class="badge-prio ${PRIO_CLASS[p]||'prio-medium'}">${PRIO_DOT[p]||''} ${PRIO_LABELS[p]||p}</span>`;
}

// ── Update sidebar badges ─────────────────────────────────────────────────
function updateBadges() {
  const all = tickets.length;
  const open = tickets.filter(t=>t.status==='open').length;
  const progress = tickets.filter(t=>t.status==='progress').length;
  const waiting = tickets.filter(t=>t.status==='waiting').length;
  const closed = tickets.filter(t=>t.status==='closed').length;
  const urgent = tickets.filter(t=>t.priority==='urgent' && t.status!=='closed').length;
  document.getElementById('badge-all').textContent = all;
  document.getElementById('badge-open').textContent = open;
  document.getElementById('badge-progress').textContent = progress;
  document.getElementById('badge-waiting').textContent = waiting;
  document.getElementById('badge-closed').textContent = closed;
  document.getElementById('badge-urgent').textContent = urgent;
}

// ── Views ──────────────────────────────────────────────────────────────────
function showView(view) {
  currentView = view;
  currentTicketId = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + view);
  if (navEl) navEl.classList.add('active');
  else document.getElementById('nav-all').classList.add('active');
  const titles = { dashboard:'Dashboard', all:'Alle Tickets', open:'Offene Tickets', progress:'In Bearbeitung', waiting:'Wartend', closed:'Geschlossene Tickets', urgent:'Dringende Tickets' };
  document.getElementById('view-title').textContent = titles[view] || 'Tickets';
  render();
}

function render() {
  updateBadges();
  if (currentTicketId) { renderDetail(); return; }
  if (currentView === 'dashboard') { renderDashboard(); return; }
  renderList();
}

// ── Dashboard ──────────────────────────────────────────────────────────────
function renderDashboard() {
  const open = tickets.filter(t=>t.status==='open').length;
  const progress = tickets.filter(t=>t.status==='progress').length;
  const closed = tickets.filter(t=>t.status==='closed').length;
  const urgent = tickets.filter(t=>t.priority==='urgent'&&t.status!=='closed').length;
  const recent = [...tickets].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,6);

  document.getElementById('content').innerHTML = `
    <div class="stats-row">
      <div class="stat-card red">
        <div class="stat-val">${urgent}</div>
        <div class="stat-label">Dringend offen</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-val">${open}</div>
        <div class="stat-label">Offen</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-val">${progress}</div>
        <div class="stat-label">In Bearbeitung</div>
      </div>
      <div class="stat-card green">
        <div class="stat-val">${closed}</div>
        <div class="stat-label">Geschlossen</div>
      </div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);font-size:0.72rem;font-family:var(--font-mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);">
        Zuletzt erstellt
      </div>
      ${recent.length === 0 ? `<div class="empty-state"><div class="empty-icon">📭</div><p>Noch keine Tickets vorhanden.<br>Klicke auf "+ Neues Ticket" um zu starten.</p></div>` :
      `<table class="ticket-table">
        <thead><tr>
          <th>ID</th><th>Titel</th><th>Priorität</th><th>Status</th><th>Gerät</th><th>Erstellt</th>
        </tr></thead>
        <tbody>${recent.map(t=>`
          <tr class="clickable" onclick="openTicket('${t.id}')">
            <td class="ticket-id">${t.id}</td>
            <td class="ticket-title-cell"><strong>${t.title}</strong><span>${t.customer||''}</span></td>
            <td>${prioBadge(t.priority)}</td>
            <td>${statusBadge(t.status)}</td>
            <td style="font-size:0.78rem;color:var(--text3)">${t.device||'–'}</td>
            <td style="font-size:0.75rem;color:var(--text3);font-family:var(--font-mono)">${dateStr(t.createdAt)}</td>
          </tr>`).join('')}
        </tbody>
      </table>`}
    </div>`;
}

// ── List ───────────────────────────────────────────────────────────────────
function renderList() {
  let filtered = [...tickets];
  if (currentView === 'open') filtered = filtered.filter(t=>t.status==='open');
  else if (currentView === 'progress') filtered = filtered.filter(t=>t.status==='progress');
  else if (currentView === 'waiting') filtered = filtered.filter(t=>t.status==='waiting');
  else if (currentView === 'closed') filtered = filtered.filter(t=>t.status==='closed');
  else if (currentView === 'urgent') filtered = filtered.filter(t=>t.priority==='urgent'&&t.status!=='closed');
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(t => t.title.toLowerCase().includes(q) || (t.customer||'').toLowerCase().includes(q) || t.id.toLowerCase().includes(q));
  }
  filtered.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  const prioOrder = {urgent:0,high:1,medium:2,low:3};
  filtered.sort((a,b)=>{
    if (a.status!=='closed' && b.status!=='closed') return (prioOrder[a.priority]||2)-(prioOrder[b.priority]||2);
    return 0;
  });

  document.getElementById('content').innerHTML = `
    <div class="filters">
      <button class="filter-btn ${filterStatus==='all'?'active':''}" onclick="setFilter('all')">Alle</button>
      <button class="filter-btn ${filterStatus==='open'?'active':''}" onclick="setFilter('open')">Offen</button>
      <button class="filter-btn ${filterStatus==='progress'?'active':''}" onclick="setFilter('progress')">In Bearbeitung</button>
      <button class="filter-btn ${filterStatus==='waiting'?'active':''}" onclick="setFilter('waiting')">Wartend</button>
      <button class="filter-btn ${filterStatus==='closed'?'active':''}" onclick="setFilter('closed')">Geschlossen</button>
      <div class="search-box">
        <input type="text" placeholder="Suche..." value="${searchQuery}" oninput="setSearch(this.value)">
      </div>
    </div>
    ${filtered.length === 0 ? `<div class="empty-state"><div class="empty-icon">📭</div><p>Keine Tickets gefunden.</p></div>` :
    `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">
      <table class="ticket-table">
        <thead><tr>
          <th>ID</th><th>Titel & Kunde</th><th>Priorität</th><th>Status</th><th>Gerät</th><th>Zugewiesen</th><th>Erstellt</th>
        </tr></thead>
        <tbody>${filtered.map(t=>`
          <tr class="clickable" onclick="openTicket('${t.id}')">
            <td class="ticket-id">${t.id}</td>
            <td class="ticket-title-cell"><strong>${t.title}</strong><span>${t.customer||''}${t.company?' · '+t.company:''}</span></td>
            <td>${prioBadge(t.priority)}</td>
            <td>${statusBadge(t.status)}</td>
            <td style="font-size:0.78rem;color:var(--text3)">${t.device||'–'}</td>
            <td style="font-size:0.78rem;color:var(--text3)">${t.assignedTo||'–'}</td>
            <td style="font-size:0.75rem;color:var(--text3);font-family:var(--font-mono)">${dateStr(t.createdAt)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`}`;
}

function setFilter(f) { filterStatus = f; render(); }
function setSearch(v) { searchQuery = v; render(); }

// ── Ticket Detail ──────────────────────────────────────────────────────────
function openTicket(id) {
  currentTicketId = id;
  document.getElementById('view-title').textContent = 'Ticket ' + id;
  renderDetail();
}

function renderDetail() {
  const t = tickets.find(x=>x.id===currentTicketId);
  if (!t) { showView('all'); return; }

  const techOptions = technicians.map(tech =>
    `<option value="${tech}" ${t.assignedTo===tech?'selected':''}>${tech}</option>`
  ).join('');

  document.getElementById('content').innerHTML = `
    <div class="ticket-detail">
      <div style="margin-bottom:14px">
        <button class="btn btn-outline btn-sm" onclick="showView('${currentView==='detail'?'all':currentView}')">← Zurück</button>
      </div>
      <div class="detail-header">
        <div class="detail-id">${t.id} · Erstellt: ${dateStr(t.createdAt)}</div>
        <h2>${t.title}</h2>
        <div class="detail-meta">
          ${prioBadge(t.priority)}
          ${statusBadge(t.status)}
          ${t.device ? `<span class="detail-meta-item">🔧 ${t.device}</span>` : ''}
          ${t.customer ? `<span class="detail-meta-item">👤 ${t.customer}${t.company?' · '+t.company:''}</span>` : ''}
          ${t.location ? `<span class="detail-meta-item">📍 ${t.location}</span>` : ''}
          ${t.phone ? `<span class="detail-meta-item">📞 ${t.phone}</span>` : ''}
        </div>
      </div>
      <div class="detail-grid">
        <div class="detail-main">
          <div class="detail-card">
            <div class="detail-card-head">Beschreibung</div>
            <div class="detail-card-body">
              <div class="detail-desc">${t.description||'Keine Beschreibung vorhanden.'}</div>
            </div>
          </div>
          <div class="detail-card">
            <div class="detail-card-head">
              Kommentare (${(t.comments||[]).length})
            </div>
            <div class="detail-card-body">
              ${(t.comments||[]).length === 0 ? '<p style="font-size:0.82rem;color:var(--text3)">Noch keine Kommentare.</p>' :
                (t.comments||[]).map(c=>`
                  <div class="comment">
                    <div class="comment-avatar">${(c.author||'?')[0].toUpperCase()}</div>
                    <div class="comment-body">
                      <div class="comment-meta">${c.author} · ${c.time}</div>
                      <div class="comment-text">${c.text}</div>
                    </div>
                  </div>`).join('')}
              <div class="comment-input-area">
                <textarea id="comment-input" placeholder="Kommentar hinzufügen..."></textarea>
                <button class="btn btn-primary btn-sm" onclick="addComment('${t.id}')">Senden</button>
              </div>
            </div>
          </div>
        </div>
        <div class="detail-side">
          <div class="detail-card">
            <div class="detail-card-head">Ticket verwalten</div>
            <div class="detail-card-body">
              <div class="info-row">
                <span class="info-label">Status</span>
                <select onchange="updateField('${t.id}','status',this.value)">
                  <option value="open" ${t.status==='open'?'selected':''}>🔵 Offen</option>
                  <option value="progress" ${t.status==='progress'?'selected':''}>🟡 In Bearbeitung</option>
                  <option value="waiting" ${t.status==='waiting'?'selected':''}>🟠 Wartend</option>
                  <option value="closed" ${t.status==='closed'?'selected':''}>🟢 Geschlossen</option>
                </select>
              </div>
              <div class="info-row">
                <span class="info-label">Priorität</span>
                <select onchange="updateField('${t.id}','priority',this.value)">
                  <option value="low" ${t.priority==='low'?'selected':''}>🟢 Niedrig</option>
                  <option value="medium" ${t.priority==='medium'?'selected':''}>🟡 Mittel</option>
                  <option value="high" ${t.priority==='high'?'selected':''}>🟠 Hoch</option>
                  <option value="urgent" ${t.priority==='urgent'?'selected':''}>🔴 Dringend</option>
                </select>
              </div>
              <div class="info-row">
                <span class="info-label">Zugewiesen</span>
                <select onchange="updateField('${t.id}','assignedTo',this.value)">
                  <option value="">– Keiner –</option>
                  ${techOptions}
                </select>
              </div>
            </div>
          </div>
          <div class="detail-card">
            <div class="detail-card-head">Aktionen</div>
            <div class="detail-card-body" style="display:flex;flex-direction:column;gap:8px">
              <button class="btn btn-outline btn-sm" style="width:100%;justify-content:center" onclick="emailTicket('${t.id}')">📧 Per E-Mail senden</button>
              <button class="btn btn-outline btn-sm" style="width:100%;justify-content:center;color:var(--red-light);border-color:var(--red)" onclick="deleteTicket('${t.id}')">🗑 Ticket löschen</button>
            </div>
          </div>
          ${t.diagnosisLog ? `
          <div class="detail-card">
            <div class="detail-card-head">Diagnoseprotokoll</div>
            <div class="detail-card-body">
              <div class="detail-desc" style="font-size:0.78rem">${t.diagnosisLog}</div>
            </div>
          </div>` : ''}
        </div>
      </div>
    </div>`;
}

// ── Ticket actions ─────────────────────────────────────────────────────────
function openNewTicket() {
  document.getElementById('new-title').value = '';
  document.getElementById('new-customer').value = '';
  document.getElementById('new-company').value = '';
  document.getElementById('new-location').value = '';
  document.getElementById('new-phone').value = '';
  document.getElementById('new-desc').value = '';
  document.getElementById('new-prio').value = 'medium';
  document.getElementById('new-device').value = '';
  // Refresh tech options
  const assignSel = document.getElementById('new-assign');
  assignSel.innerHTML = '<option value="">– Nicht zugewiesen –</option>' +
    technicians.map(t=>`<option value="${t}">${t}</option>`).join('');
  openModal('modal-new');
  setTimeout(()=>document.getElementById('new-title').focus(), 100);
}

function saveNewTicket() {
  const title = document.getElementById('new-title').value.trim();
  const customer = document.getElementById('new-customer').value.trim();
  if (!title) { toast('⚠ Bitte einen Titel eingeben'); return; }
  if (!customer) { toast('⚠ Bitte einen Kundennamen eingeben'); return; }
  const ticket = {
    id: genId(),
    title,
    status: 'open',
    priority: document.getElementById('new-prio').value,
    device: document.getElementById('new-device').value,
    customer,
    company: document.getElementById('new-company').value.trim(),
    location: document.getElementById('new-location').value.trim(),
    phone: document.getElementById('new-phone').value.trim(),
    assignedTo: document.getElementById('new-assign').value,
    description: document.getElementById('new-desc').value.trim(),
    comments: [],
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };
  tickets.unshift(ticket);
  save();
  closeModal('modal-new');
  toast('✅ Ticket ' + ticket.id + ' erstellt');
  openTicket(ticket.id);
}

function updateField(id, field, value) {
  const t = tickets.find(x=>x.id===id);
  if (!t) return;
  t[field] = value;
  t.updatedAt = new Date().toISOString();
  if (field==='status' && value==='closed') t.closedAt = new Date().toISOString();
  save();
  updateBadges();
  toast('✅ Aktualisiert');
}

function addComment(id) {
  const t = tickets.find(x=>x.id===id);
  if (!t) return;
  const text = document.getElementById('comment-input').value.trim();
  if (!text) return;
  if (!t.comments) t.comments = [];
  t.comments.push({ author: 'Disponent', text, time: now() });
  t.updatedAt = new Date().toISOString();
  save();
  renderDetail();
  toast('💬 Kommentar gespeichert');
}

function deleteTicket(id) {
  if (!confirm('Ticket wirklich löschen?')) return;
  tickets = tickets.filter(x=>x.id!==id);
  save();
  toast('🗑 Ticket gelöscht');
  showView('all');
}

function emailTicket(id) {
  const t = tickets.find(x=>x.id===id);
  if (!t) return;
  let body = `TICKET ${t.id} – ${t.title}
`;
  body += `Erstellt: ${dateStr(t.createdAt)}
`;
  body += `Status: ${STATUS_LABELS[t.status]}
`;
  body += `Priorität: ${PRIO_LABELS[t.priority]}

`;
  body += `KUNDENDATEN
Name: ${t.customer||'–'}
Firma: ${t.company||'–'}
Einsatzort: ${t.location||'–'}
Telefon: ${t.phone||'–'}

`;
  body += `BESCHREIBUNG
${t.description||'–'}

`;
  if (t.comments?.length) {
    body += `KOMMENTARE
`;
    t.comments.forEach(c => body += `[${c.time}] ${c.author}: ${c.text}
`);
  }
  window.open(`mailto:?subject=${encodeURIComponent('Ticket '+t.id+': '+t.title)}&body=${encodeURIComponent(body)}`);
  toast('📧 E-Mail-Client geöffnet');
}

function exportAll() {
  const open = tickets.filter(t=>t.status!=='closed');
  let body = `TICKET-EXPORT – ${now()}
Gesamt: ${tickets.length} | Offen: ${open.length}

`;
  tickets.forEach(t => {
    body += `${t.id} | ${t.title} | ${STATUS_LABELS[t.status]} | ${PRIO_LABELS[t.priority]} | ${t.customer||'–'} | ${dateStr(t.createdAt)}
`;
  });
  window.open(`mailto:?subject=${encodeURIComponent('Ticket-Export '+now())}&body=${encodeURIComponent(body)}`);
  toast('📤 Export geöffnet');
}

// ── Technicians ────────────────────────────────────────────────────────────
function saveTechs() {
  const input = document.getElementById('tech-input').value.trim();
  if (input) {
    const newTechs = input.split(',').map(t=>t.trim()).filter(t=>t);
    newTechs.forEach(t => { if (!technicians.includes(t)) technicians.push(t); });
  }
  save();
  closeModal('modal-tech');
  toast('✅ Techniker gespeichert');
}

// ── URL params: create ticket from Störungs-App ───────────────────────────
function checkUrlParams() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('action') === 'new') {
    const ticket = {
      id: genId(),
      title: params.get('title') || 'Störungsmeldung',
      status: 'open',
      priority: params.get('priority') || 'medium',
      device: params.get('device') || '',
      customer: params.get('customer') || '',
      company: params.get('company') || '',
      location: params.get('location') || '',
      phone: params.get('phone') || '',
      assignedTo: '',
      description: params.get('desc') || '',
      diagnosisLog: params.get('log') || '',
      comments: [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    tickets.unshift(ticket);
    save();
    history.replaceState({}, '', 'tickets.html');
    toast('✅ Ticket aus Störungs-App erstellt: ' + ticket.id);
    openTicket(ticket.id);
    return true;
  }
  return false;
}

// ── Init ───────────────────────────────────────────────────────────────────
if (!checkUrlParams()) {
  render();
}
</script>
</body>
</html>
