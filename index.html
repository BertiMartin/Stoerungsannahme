<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Störungsannahme – Geräteservice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f2ed;
  --surface: #ffffff;
  --surface2: #f0ece4;
  --border: #d8d2c8;
  --accent: #c0392b;
  --accent2: #e8d5b7;
  --text: #1a1612;
  --muted: #7a7068;
  --success: #2d7a4f;
  --warn: #c0392b;
  --radius: 6px;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.app-shell {
  max-width: 780px;
  margin: 0 auto;
  padding: 2rem 1rem 4rem;
}

/* Header */
.app-header {
  text-align: center;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 2px solid var(--accent);
}
.app-header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 2.2rem;
  letter-spacing: -0.5px;
  color: var(--text);
}
.app-header p {
  color: var(--muted);
  font-size: .9rem;
  margin-top: .4rem;
}

/* Progress bar */
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 99px;
  margin-bottom: 2rem;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  transition: width .4s ease;
}

/* Step label */
.step-label {
  font-size: .75rem;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .6rem;
}

/* Card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2rem;
  margin-bottom: 1.2rem;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}

/* Form elements */
label {
  display: block;
  font-size: .85rem;
  font-weight: 500;
  margin-bottom: .35rem;
  color: var(--text);
}
label span.req { color: var(--accent); }

input[type="text"], input[type="tel"], input[type="email"], textarea {
  width: 100%;
  padding: .65rem .9rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: .9rem;
  background: var(--bg);
  color: var(--text);
  transition: border-color .2s;
  outline: none;
}
input:focus, textarea:focus { border-color: var(--accent); background: #fff; }
.field { margin-bottom: 1.1rem; }
.field-error { font-size:.76rem; color: var(--warn); margin-top:.25rem; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  padding: .65rem 1.4rem;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: .9rem;
  font-weight: 500;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all .18s;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-primary:hover { background: #a93226; }
.btn-outline {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-success {
  background: var(--success);
  color: #fff;
  border-color: var(--success);
}
.btn-sm { padding: .4rem .85rem; font-size: .82rem; }

/* Device grid */
.device-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: .8rem;
}
.device-card {
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem;
  cursor: pointer;
  transition: all .18s;
  background: var(--surface);
  text-align: center;
}
.device-card:hover { border-color: var(--accent); background: #fff5f5; }
.device-card.selected { border-color: var(--accent); background: #fff5f5; box-shadow: 0 0 0 2px #c0392b33; }
.device-card .icon { font-size: 1.8rem; margin-bottom: .5rem; }
.device-card .label { font-size: .88rem; font-weight: 600; }
.device-card .code { font-size: .73rem; color: var(--muted); }
.urgent .device-card { border-color: #e74c3c; }

/* Sub-category pills */
.sub-pills { display: flex; gap: .7rem; flex-wrap: wrap; }
.pill {
  padding: .6rem 1.3rem;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  cursor: pointer;
  font-size: .88rem;
  font-weight: 500;
  transition: all .18s;
  background: var(--surface);
}
.pill:hover { border-color: var(--accent); }
.pill.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Fault type list */
.fault-list { display: flex; flex-direction: column; gap: .5rem; }
.fault-item {
  padding: .8rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: .9rem;
  transition: all .18s;
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: .7rem;
}
.fault-item:hover { border-color: var(--accent); background: #fff5f5; }
.fault-item.selected { border-color: var(--accent); background: #fff5f5; font-weight: 600; }
.fault-num {
  font-size: .75rem;
  font-weight: 700;
  color: var(--accent);
  background: #fdecea;
  border-radius: 99px;
  padding: .15rem .5rem;
  min-width: 1.5rem;
  text-align: center;
}

/* Question card */
.question-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
}
.question-text {
  font-family: 'DM Serif Display', serif;
  font-size: 1.05rem;
  margin-bottom: 1rem;
  line-height: 1.5;
}
.answer-btns { display: flex; gap: .6rem; flex-wrap: wrap; }
.ans-btn {
  padding: .55rem 1.2rem;
  border-radius: var(--radius);
  border: 1.5px solid var(--border);
  font-family: inherit;
  font-size: .88rem;
  cursor: pointer;
  transition: all .18s;
  background: var(--surface);
}
.ans-btn:hover { border-color: var(--accent); }
.ans-btn.ja { border-color: #27ae60; color: #27ae60; }
.ans-btn.ja:hover, .ans-btn.ja.selected { background: #27ae60; color: #fff; border-color: #27ae60; }
.ans-btn.nein { border-color: #e74c3c; color: #e74c3c; }
.ans-btn.nein:hover, .ans-btn.nein.selected { background: #e74c3c; color: #fff; border-color: #e74c3c; }
.ans-btn.other { border-color: var(--border); color: var(--muted); }
.ans-btn.other.selected { background: var(--muted); color: #fff; }

/* Action button (inline action after answer) */
.action-banner {
  background: #fff8e1;
  border: 1px solid #ffe082;
  border-radius: var(--radius);
  padding: .9rem 1.1rem;
  margin-top: .8rem;
  font-size: .88rem;
  color: #5d4037;
}
.action-banner strong { display: block; margin-bottom: .4rem; }

/* Conclusion banner */
.conclusion-banner {
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  margin-top: .8rem;
  font-size: .88rem;
  font-weight: 600;
}
.conclusion-banner.ok { background: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; }
.conclusion-banner.warn { background: #fdecea; border: 1px solid #ef9a9a; color: #b71c1c; }

/* Extra input area */
.extra-area { margin-top: .9rem; display: flex; flex-direction: column; gap: .5rem; }

/* Report */
.report-section { margin-bottom: 1.5rem; }
.report-section h3 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.05rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: .4rem;
  margin-bottom: .8rem;
}
.report-row { display: flex; gap: .5rem; padding: .35rem 0; font-size: .88rem; border-bottom: 1px dotted var(--border); }
.report-label { font-weight: 600; min-width: 180px; color: var(--muted); }
.report-val { flex: 1; }

/* Urgency badge */
.urgency-badge {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  font-size: .72rem;
  font-weight: 700;
  padding: .2rem .7rem;
  border-radius: 99px;
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-left: .6rem;
  vertical-align: middle;
}

/* Nav row */
.nav-row { display: flex; gap: .8rem; justify-content: space-between; margin-top: 1.5rem; align-items: center; }

/* Image preview */
.img-preview { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
.img-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); }

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: var(--success);
  color: #fff;
  padding: .9rem 1.4rem;
  border-radius: var(--radius);
  font-size: .9rem;
  font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
  z-index: 9999;
  animation: slideUp .3s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity:0; } to { transform: translateY(0); opacity:1; } }

h2 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; margin-bottom: 1rem; }
.muted { color: var(--muted); font-size: .85rem; }
.mt1 { margin-top: .5rem; }
  </style>
</head>

// Helper to get questions array for a device+sub key
function getQuestionSet(deviceId, subCat) {
  if (deviceId === "urgent") return QUESTIONS.urgent;
  if (deviceId === "GL") return QUESTIONS.GL;
  if (deviceId === "GS") return subCat === "elektro" ? QUESTIONS.GS_elektro : QUESTIONS.GS_diesel;
  if (deviceId === "GGGT") return subCat === "elektro" ? QUESTIONS.GGGT_elektro : QUESTIONS.GGGT_diesel;
  if (deviceId === "GTSR") return QUESTIONS.GTSR;
  if (deviceId === "GTS") return QUESTIONS.GTS;
  if (deviceId === "GST") return QUESTIONS.GST;
  return null;
}

// Build a lookup map of questionId -> question for a set
function buildQMap(faults) {
  const map = {};
  faults.forEach(f => f.questions.forEach(q => { map[q.id] = q; }));
  return map;
}

function getQuestionSetLang(deviceId, subCat, lang) {
  const Q = lang === 'en' ? QUESTIONS_EN : QUESTIONS;
  if (deviceId === 'urgent') return Q.urgent;
  if (deviceId === 'GL') return Q.GL;
  if (deviceId === 'GS') return subCat === 'elektro' ? Q.GS_elektro : Q.GS_diesel;
  if (deviceId === 'GGGT') return subCat === 'elektro' ? Q.GGGT_elektro : Q.GGGT_diesel;
  if (deviceId === 'GTSR') return Q.GTSR;
  if (deviceId === 'GTS') return Q.GTS;
  if (deviceId === 'GST') return Q.GST;
  return null;
}

  followUpState: null,
  questionHistory: [],
  extraCode: "",
  extraPhotos: [],
  showExtraInputs: false,
  sonstigerText: "",
  toastTimer: null
};

const t = (key) => (UI[state.lang] || UI.de)[key] || key;

function setState(updates) {
  Object.assign(state, updates);
  render();
}

// ── Helpers ────────────────────────────────────────────────────────────────
function getQS() {
  return state.deviceId ? getQuestionSetLang(state.deviceId, state.subCat, state.lang) : null;
}
function getQMap() {
  const qs = getQS();
  return qs ? buildQMap(qs.faults) : {};
}
function getCurrentFault() {
  const qs = getQS();
  return qs ? qs.faults.find(f => f.id === state.faultId) : null;
}
function getCurrentQ() {
  return state.currentQId ? getQMap()[state.currentQId] : null;
}
function getNextQId(q) {
  const cf = getCurrentFault();
  if (!cf) return null;
  const idx = cf.questions.findIndex(x => x.id === q.id);
  if (idx >= 0 && idx < cf.questions.length - 1) return cf.questions[idx+1].id;
  return null;
}
function logQA(qText, ansLabel, action, code, photos) {
  state.qaLog = [...state.qaLog, { questionText: qText, answerLabel: ansLabel, actionTaken: action || null, errorCode: code || "", photos: photos || [] }];
}
function saveHistory() {
  state.questionHistory = [...state.questionHistory, {
    currentQId: state.currentQId,
    qaLog: [...state.qaLog],
    followUpState: state.followUpState,
    showExtraInputs: state.showExtraInputs,
    extraCode: state.extraCode,
    extraPhotos: [...state.extraPhotos]
  }];
}
function showToast(msg) {
  if (state.toastTimer) clearTimeout(state.toastTimer);
  state.toast = msg;
  state.toastTimer = setTimeout(() => { state.toast = null; render(); }, 3000);
  render();
}
function resetAll() {
  Object.assign(state, {
    step:"customer", deviceId:null, subCat:null, faultId:null,
    qaLog:[], conclusion:null, followUpState:null, extraCode:"", extraPhotos:[],
    email:"", showExtraInputs:false, bemerkung:"", questionHistory:[], sonstigerText:"",
    customer:{ geraeteNr:"", name:"", firma:"", einsatzort:"", telefon:"" }, errors:{}
  });
  render();
}
function validateCustomer() {
  const e = {};
  if (!state.customer.name.trim()) e.name = t("pflichtfeld");
  if (!state.customer.firma.trim()) e.firma = t("pflichtfeld");
  if (!state.customer.einsatzort.trim()) e.einsatzort = t("pflichtfeld");
  if (!state.customer.telefon.trim()) e.telefon = t("pflichtfeld");
  state.errors = e;
  return Object.keys(e).length === 0;
}
function selectDevice(id) {
  state.deviceId = id;
  const dev = (state.lang === "en" ? DEVICES_EN : DEVICES).find(d => d.id === id);
  if (dev.hasSub) state.step = "subcategory";
  else { state.subCat = null; state.step = "fault"; }
  render();
}
function startFault(fid) {
  state.faultId = fid;
  state.qaLog = []; state.conclusion = null; state.followUpState = null;
  state.extraCode = ""; state.extraPhotos = []; state.showExtraInputs = false;
  state.questionHistory = [];
  const qs = getQS();
  const fault = qs.faults.find(f => f.id === fid);
  state.currentQId = fault.questions[0].id;
  state.step = "questions";
  render();
}
function goBack() {
  if (state.questionHistory.length === 0) {
    state.step = "fault"; state.qaLog = []; state.followUpState = null;
    state.showExtraInputs = false; state.extraCode = ""; state.extraPhotos = [];
    render(); return;
  }
  const prev = state.questionHistory[state.questionHistory.length-1];
  state.questionHistory = state.questionHistory.slice(0,-1);
  state.currentQId = prev.currentQId; state.qaLog = prev.qaLog;
  state.followUpState = prev.followUpState; state.showExtraInputs = prev.showExtraInputs;
  state.extraCode = prev.extraCode; state.extraPhotos = prev.extraPhotos;
  state.conclusion = null;
  if (state.step === "report") state.step = "questions";
  render();
}
function handleAnswer(q, ans) {
  if (state.followUpState) { handleFollowUpAnswer(q, ans); return; }
  saveHistory();
  if (ans.conclusion) {
    logQA(q.text, ans.label, null, state.extraCode, state.extraPhotos);
    state.conclusion = { text: ans.conclusion, type: ans.conclusionType };
    state.step = "report"; render(); return;
  }
  if (ans.action && ans.followUp) {
    logQA(q.text, ans.label, ans.actionBtn || ans.action, "", []);
    state.followUpState = { phase: 1, ans, q };
    render(); return;
  }
  logQA(q.text, ans.label, null, "", []);
  state.showExtraInputs = false;
  const nextId = ans.next || getNextQId(q);
  if (nextId) state.currentQId = nextId;
  else { state.conclusion = { text: t("diagnoseAbgeschlossen") || "Fehlerdiagnose abgeschlossen", type: "ok" }; state.step = "report"; }
  render();
}
function handleFollowUpAnswer(q, ans) {
  const { phase, ans: origAns } = state.followUpState;
  saveHistory();
  const isJa = ans.label === "Ja" || (ans.label && ans.label.startsWith("Ja")) || (ans.label && ans.label.startsWith("Yes"));
  if (phase === 1) {
    if (isJa) {
      if (origAns.followUpYesConclusion) {
        logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", ans.label, null, "", []);
        state.followUpState = null;
        state.conclusion = { text: origAns.followUpYesConclusion, type: origAns.followUpYesConclusionType || "ok" };
        state.step = "report";
      } else if (origAns.followUpYesFollowUp2) {
        logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", ans.label, null, "", []);
        state.followUpState = { phase: 2, ans: origAns, q };
      } else if (origAns.followUpYesNext) {
        logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", ans.label, null, "", []);
        state.followUpState = null;
        state.currentQId = origAns.followUpYesNext;
      }
    } else {
      if (origAns.followUpNoConclusion) {
        logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", ans.label, null, "", []);
        state.followUpState = null;
        state.conclusion = { text: origAns.followUpNoConclusion, type: origAns.followUpNoConclusionType || "warn" };
        state.step = "report";
      } else if (origAns.followUpNoNext) {
        logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", ans.label, null, "", []);
        state.followUpState = null;
        state.currentQId = origAns.followUpNoNext;
      } else {
        logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", ans.label, null, "", []);
        state.followUpState = null;
        const nextId = getNextQId(q);
        if (nextId) state.currentQId = nextId;
        else { state.conclusion = { text: "Fehlerdiagnose abgeschlossen – Monteureinsatz planen", type: "warn" }; state.step = "report"; }
      }
    }
  } else if (phase === 2) {
    if (isJa) {
      const res = origAns.followUpYesFollowUp2Yes;
      logQA(origAns.followUpYesFollowUp2Text, ans.label, null, "", []);
      state.followUpState = null;
      if (res.conclusion) { state.conclusion = { text: res.conclusion, type: res.conclusionType }; state.step = "report"; }
      else if (res.next) state.currentQId = res.next;
    } else {
      const res = origAns.followUpYesFollowUp2No;
      logQA(origAns.followUpYesFollowUp2Text, ans.label, null, "", []);
      state.followUpState = null;
      if (res.conclusion) { state.conclusion = { text: res.conclusion, type: res.conclusionType }; state.step = "report"; }
      else if (res.next) state.currentQId = res.next;
      else { const nextId = getNextQId(q); if (nextId) state.currentQId = nextId; else { state.conclusion = { text: "Fehlerdiagnose abgeschlossen – Monteureinsatz planen", type: "warn" }; state.step = "report"; } }
    }
  }
  render();
}
function handleFinalAnswer(q, ans) {
  saveHistory();
  logQA(q.text, ans.label, null, state.extraCode, state.extraPhotos);
  if (ans.conclusion) state.conclusion = { text: ans.conclusion, type: ans.conclusionType };
  else state.conclusion = { text: "Fehlerdiagnose abgeschlossen – Monteureinsatz planen", type: "warn" };
  state.step = "report"; render();
}
function buildMailBody() {
  const isEn = state.lang === "en";
  const devList = isEn ? DEVICES_EN : DEVICES;
  const devLabel = devList.find(d => d.id === state.deviceId)?.label || state.deviceId;
  const subLabel = state.subCat ? (state.subCat === "elektro" ? t("elektroLabel") : t("dieselLabel")) : "";
  const faultLabel = state.faultId === "sonstiger" ? t("sonstigerFehler") : (getCurrentFault()?.label || "");
  let body = isEn ? "FAULT REPORT – FINAL SUMMARY\n" : "STÖRUNGSANNAHME – ABSCHLUSSBERICHT\n";
  body += `${isEn?"Date":"Datum"}: ${new Date().toLocaleString(isEn?"en-GB":"de-DE")}\n\n`;
  body += isEn ? "CUSTOMER DATA\n" : "KUNDENDATEN\n";
  body += `${isEn?"Device No.":"Gerätenummer"}: ${state.customer.geraeteNr||"–"}\n`;
  body += `Name: ${state.customer.name}\n${isEn?"Company":"Firma"}: ${state.customer.firma}\n${isEn?"Location":"Einsatzort"}: ${state.customer.einsatzort}\n${isEn?"Phone":"Telefon"}: ${state.customer.telefon}\n\n`;
  body += isEn ? "DEVICE\n" : "GERÄT\n";
  body += `${devLabel}${subLabel?" – "+subLabel:""} | ${isEn?"Fault type":"Störungstyp"}: ${faultLabel}\n\n`;
  body += isEn ? "DIAGNOSIS\n" : "DIAGNOSE\n";
  state.qaLog.forEach((qa, i) => {
    body += `\n${isEn?"Question":"Frage"} ${i+1}: ${qa.questionText}\n${isEn?"Answer":"Antwort"}: ${qa.answerLabel}`;
    if (qa.actionTaken) body += `\n${isEn?"Action taken":"Maßnahme"}: ${qa.actionTaken}`;
    if (qa.errorCode) body += `\n${isEn?"Error code":"Fehlercode"}: ${qa.errorCode}`;
    if (qa.photos?.length > 0) body += `\n${isEn?"Photos":"Fotos"}: ${qa.photos.length} ${isEn?"image(s)":"Bild(er)"}`;
    body += "\n";
  });
  body += `\n${isEn?"RESULT":"ERGEBNIS"}: ${state.conclusion?.text||""}`;
  if (state.bemerkung.trim()) body += `\n\n${isEn?"CUSTOMER REMARKS":"BEMERKUNG"}:\n${state.bemerkung}`;
  return body;
}
function handleSend() {
  if (!state.email.trim()) { showToast("Bitte E-Mail-Adresse eingeben"); return; }
  const body = buildMailBody();
  const subject = encodeURIComponent("Störungsannahme – Abschlussbericht");
  window.open(`mailto:${state.email}?subject=${subject}&body=${encodeURIComponent(body)}`);
  showToast("E-Mail-Client geöffnet ✓");
  state.step = "send"; render();
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === 'className') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'htmlFor') el.setAttribute('for', v);
      else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v);
    });
  }
  children.flat(Infinity).forEach(c => {
    if (c === null || c === undefined || c === false) return;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  });
  return el;
}

function renderQuestions() {
  const currentQ = getCurrentQ();
  const cf = getCurrentFault();
  const qs = getQS();
  const isDisplayError = currentQ && (currentQ.extraCode || currentQ.extraPhoto);

  const parts = [];

  // Previous answers summary
  if (state.qaLog.length > 0) {
    parts.push(h('div', {className:'card', style:{marginBottom:'1rem'}},
      h('div', {className:'step-label'}, t("bisherigeAntworten")),
      ...state.qaLog.map((qa, i) =>
        h('div', {style:{marginBottom:'.4rem', fontSize:'.85rem'}},

          h('span', {style:{color:'var(--accent)', fontWeight:600}}, qa.answerLabel)
        )
      )
    ));
  }

  // Current question
  if (currentQ && !state.followUpState) {
    parts.push(h('div', {className:'question-block'},
      h('div', {className:'question-text'}, currentQ.text),
      ...(() => {
        if (isDisplayError && !state.showExtraInputs) {
          return [
            h('div', {className:'answer-btns'},
              h('button', {className:'ans-btn ja', onClick:()=>{ state.showExtraInputs=true; render(); }}, 'Ja'),
              h('button', {className:'ans-btn nein', onClick:()=>{
                logQA(currentQ.text, 'Nein', null, '', []);
                const neinAns = currentQ.answers.find(a => a.label.startsWith('Nein') || a.label.startsWith('No'));
                if (neinAns?.conclusion) { state.conclusion={text:neinAns.conclusion,type:neinAns.conclusionType}; state.step='report'; render(); }
              }}, 'Nein')
            )
          ];
        } else if (isDisplayError && state.showExtraInputs) {
          const codeInp = currentQ.extraCode ? (() => {
            const inp = h('input', {type:'text', placeholder: t("fehlercodePH"), value: state.extraCode});
            inp.addEventListener('input', e => { state.extraCode = e.target.value; });
            return inp;
          })() : null;

          const fileInp = h('input', {type:'file', accept:'image/*', multiple:'true', style:{display:'none'}});
          fileInp.addEventListener('change', e => {
            Array.from(e.target.files).forEach(f => {
              const reader = new FileReader();
              reader.onload = ev => { state.extraPhotos = [...state.extraPhotos, ev.target.result]; render(); };
              reader.readAsDataURL(f);
            });
          });

          return [
            h('div', {className:'extra-area'},
              codeInp,
              currentQ.extraPhoto ? h('button', {className:'btn btn-outline btn-sm', onClick:()=>fileInp.click()}, t("fotosHochladen")) : null,
              currentQ.extraPhoto ? fileInp : null,
              state.extraPhotos.length > 0 ? h('div', {className:'img-preview'}, ...state.extraPhotos.map(src=>h('img',{src,alt:'foto',className:'img-thumb'}))) : null
            ),
            h('div', {style:{marginTop:'1rem'}},
              h('button', {className:'btn btn-primary', onClick:()=>{
                const jaAns = currentQ.answers.find(a => a.label.startsWith('Ja') || a.label.startsWith('Yes'));
                handleFinalAnswer(currentQ, jaAns || currentQ.answers[1] || currentQ.answers[0]);
                state.showExtraInputs = false;
              }}, t("diagnoseAbschliessen"))
            )
          ];
        } else {
          return [
            h('div', {className:'answer-btns'},
              ...currentQ.answers.map(ans => {
                const isJa = ans.label.startsWith('Ja') || ans.label.startsWith('Yes');
                const isNein = ans.label.startsWith('Nein') || ans.label.startsWith('No');
                const cls = isJa ? 'ja' : isNein ? 'nein' : 'other';
                return h('button', {className:`ans-btn ${cls}`, onClick:()=>handleAnswer(currentQ, ans)}, ans.label);
              })
            )
          ];
        }
      })()
    ));
  }

  // Follow-up phase 1
  if (state.followUpState && state.followUpState.phase === 1) {
    const {ans, q} = state.followUpState;
    parts.push(h('div', {className:'question-block'},
      h('div', {className:'action-banner'},
        h('strong', {}, t("massnahmeDurchfuehren")), ans.action
      ),
      h('div', {className:'question-text', style:{marginTop:'1rem'}}, ans.followUpText || "Ist die Funktion jetzt gegeben?"),
      h('div', {className:'answer-btns'},
        h('button', {className:'ans-btn ja', onClick:()=>handleFollowUpAnswer(q, {label:'Ja'})}, 'Ja'),
        h('button', {className:'ans-btn nein', onClick:()=>handleFollowUpAnswer(q, {label:'Nein'})}, 'Nein')
      )
    ));
  }

  // Follow-up phase 2
  if (state.followUpState && state.followUpState.phase === 2) {
    const {ans, q} = state.followUpState;
    parts.push(h('div', {className:'question-block'},
      h('div', {className:'question-text'}, ans.followUpYesFollowUp2Text),
      h('div', {className:'answer-btns'},
        h('button', {className:'ans-btn ja', onClick:()=>handleFollowUpAnswer(q, {label:'Ja'})}, 'Ja'),
        h('button', {className:'ans-btn nein', onClick:()=>handleFollowUpAnswer(q, {label:'Nein'})}, 'Nein')
      )
    ));
  }

  parts.push(h('div', {className:'nav-row'},
    h('button', {className:'btn btn-outline', onClick:goBack}, t("zurueck")),
    h('button', {className:'btn btn-outline', onClick:resetAll}, t("neueMeldung"))
  ));

  return h('div', {}, ...parts);
}

    h('h2', {}, t("sendDoneTitle")),
    h('p', {className:'muted', style:{margin:'1rem 0'}}, t("sendDoneSub"), ' ', h('strong', {}, state.email), ' ', t("sendDoneSub2")),
    h('button', {className:'btn btn-primary', style:{marginTop:'1rem'}, onClick:resetAll}, t("neueStorung"))
  );
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';

  const appShell = h('div', {className:'app-shell'},
    h('div', {className:'app-header'},
      h('h1', {}, t("appTitle")),
      h('p', {}, t("appSub"))
    ),
    progressBar(),
    (() => {
      switch(state.step) {
        case 'lang': return renderLang();
        case 'customer': return renderCustomer();
        case 'device': return renderDevice();
        case 'subcategory': return renderSubcategory();
        case 'fault': return renderFault();
        case 'sonstiger': return renderSonstiger();
        case 'questions': return renderQuestions();
        case 'report': return renderReport();
        case 'send': return renderSendDone();
        default: return renderLang();
      }
    })(),
    state.toast ? h('div', {className:'toast'}, state.toast) : null
  );

  root.appendChild(appShell);
}

// Boot
render();
  </script>
</body>
</html>
