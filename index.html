// Helper to get questions array for a device+sub key
function getQuestionSet(deviceId, subCat) {
  if (deviceId === "urgent") return QUESTIONS.urgent;
  if (deviceId === "GL") return QUESTIONS.GL;
  if (deviceId === "GS") return subCat === "elektro" ? QUESTIONS.GS_elektro : QUESTIONS.GS_diesel;
  if (deviceId === "GGGT") return subCat === "elektro" ? QUESTIONS.GGGT_elektro : QUESTIONS.GGGT_diesel;
  if (deviceId === "GTSR") return QUESTIONS.GTSR;
  if (deviceId === "GTS") return QUESTIONS.GTS;
  if (deviceId === "GST") return QUESTIONS.GST;
  return null;
}

// Build a lookup map of questionId -> question for a set
function buildQMap(faults) {
  const map = {};
  faults.forEach(f => f.questions.forEach(q => { map[q.id] = q; }));
  return map;
}

function getQuestionSetLang(deviceId, subCat, lang) {
  const Q = lang === 'en' ? QUESTIONS_EN : QUESTIONS;
  if (deviceId === 'urgent') return Q.urgent;
  if (deviceId === 'GL') return Q.GL;
  if (deviceId === 'GS') return subCat === 'elektro' ? Q.GS_elektro : Q.GS_diesel;
  if (deviceId === 'GGGT') return subCat === 'elektro' ? Q.GGGT_elektro : Q.GGGT_diesel;
  if (deviceId === 'GTSR') return Q.GTSR;
  if (deviceId === 'GTS') return Q.GTS;
  if (deviceId === 'GST') return Q.GST;
  return null;
}


// ── Main App ───────────────────────────────────────────────────────────────
export default function App() {
  // Steps: customer | device | subcategory | fault | questions | report | send
  const [step, setStep] = useState("lang");
  const [lang, setLang] = useState("de");
  const t = (key) => UI[lang][key] || key;
  const [customer, setCustomer] = useState({ geraeteNr:"", name:"", firma:"", einsatzort:"", telefon:"" });
  const [errors, setErrors] = useState({});
  const [deviceId, setDeviceId] = useState(null);
  const [subCat, setSubCat] = useState(null); // elektro | diesel
  const [faultId, setFaultId] = useState(null);
  const [qaLog, setQaLog] = useState([]); // [{questionText, answerLabel, actionTaken, errorCode, photos}]
  const [conclusion, setConclusion] = useState(null); // {text, type}
  const [email, setEmail] = useState("");
  const [bemerkung, setBemerkung] = useState("");
  const [toast, setToast] = useState(null);
  const [currentQId, setCurrentQId] = useState(null);
  const [followUpState, setFollowUpState] = useState(null); // null | {phase:1|2, answer, q}
  const [questionHistory, setQuestionHistory] = useState([]); // stack of {currentQId, qaLog, followUpState, showExtraInputs, extraCode, extraPhotos}
  const [extraCode, setExtraCode] = useState("");
  const [extraPhotos, setExtraPhotos] = useState([]); // base64 strings
  const [showExtraInputs, setShowExtraInputs] = useState(false);
  const [sonstigerText, setSonstigerText] = useState("");
  const photoRef = useRef();

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

  // ── customer validation ──
  const validateCustomer = () => {
    const e = {};
    if (!customer.name.trim()) e.name = "Pflichtfeld";
    if (!customer.firma.trim()) e.firma = "Pflichtfeld";
    if (!customer.einsatzort.trim()) e.einsatzort = "Pflichtfeld";
    if (!customer.telefon.trim()) e.telefon = "Pflichtfeld";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  // ── device select ──
  const selectDevice = (id) => {
    setDeviceId(id);
    const dev = DEVICES.find(d => d.id === id);
    if (dev.hasSub) setStep("subcategory");
    else { setSubCat(null); setStep("fault"); }
  };

  // ── question navigation ──
  const startFault = (fid) => {
    setFaultId(fid);
    setQaLog([]);
    setConclusion(null);
    setFollowUpState(null);
    setExtraCode("");
    setExtraPhotos([]);
    setShowExtraInputs(false);
    setQuestionHistory([]);
    const qs = getQuestionSet(deviceId, subCat);
    const fault = qs.faults.find(f => f.id === fid);
    setCurrentQId(fault.questions[0].id);
    setStep("questions");
  };

  const qs = deviceId ? getQuestionSetLang(deviceId, subCat, lang) : null;
  const qMap = qs ? buildQMap(qs.faults) : {};
  const currentFault = qs ? qs.faults.find(f => f.id === faultId) : null;
  const currentQ = currentQId ? qMap[currentQId] : null;

  // Get next question id (linear fallback)
  const getNextQId = (q) => {
    if (!currentFault) return null;
    const idx = currentFault.questions.findIndex(x => x.id === q.id);
    if (idx >= 0 && idx < currentFault.questions.length - 1) return currentFault.questions[idx + 1].id;
    return null;
  };

  const logQA = (qText, ansLabel, action, code, photos) => {
    setQaLog(prev => [...prev, { questionText: qText, answerLabel: ansLabel, actionTaken: action || null, errorCode: code || "", photos: photos || [] }]);
  };

  const saveHistory = (currentQaLog) => {
    setQuestionHistory(prev => [...prev, {
      currentQId,
      qaLog: currentQaLog !== undefined ? [...currentQaLog] : [...qaLog],
      followUpState,
      showExtraInputs,
      extraCode,
      extraPhotos: [...extraPhotos]
    }]);
  };

  const goBack = () => {
    if (questionHistory.length === 0) {
      setStep("fault");
      setQaLog([]);
      setFollowUpState(null);
      setShowExtraInputs(false);
      setExtraCode("");
      setExtraPhotos([]);
      return;
    }
    const prev = questionHistory[questionHistory.length - 1];
    setQuestionHistory(h => h.slice(0, -1));
    setCurrentQId(prev.currentQId);
    setQaLog(prev.qaLog);
    setFollowUpState(prev.followUpState);
    setShowExtraInputs(prev.showExtraInputs);
    setExtraCode(prev.extraCode);
    setExtraPhotos(prev.extraPhotos);
    setConclusion(null);
    if (step === "report") setStep("questions");
  };

  const handleAnswer = (q, ans) => {
    if (followUpState) {
      handleFollowUpAnswer(q, ans);
      return;
    }

    const hasAction = !!ans.action;
    const hasFollowUp = ans.followUp;

    // Save state BEFORE any changes – pass current qaLog explicitly
    saveHistory(qaLog);

    if (ans.conclusion) {
      logQA(q.text, ans.label, null, extraCode, extraPhotos);
      setConclusion({ text: ans.conclusion, type: ans.conclusionType });
      setStep("report");
      return;
    }

    if (hasAction && hasFollowUp) {
      logQA(q.text, ans.label, ans.actionBtn || ans.action, "", []);
      setFollowUpState({ phase: 1, ans, q });
      return;
    }

    // Simple next
    logQA(q.text, ans.label, null, "", []);
    setShowExtraInputs(false);
    const nextId = ans.next || getNextQId(q);
    if (nextId) setCurrentQId(nextId);
    else { setConclusion({ text: "Fehlerdiagnose abgeschlossen", type: "ok" }); setStep("report"); }
  };

  const handleFollowUpAnswer = (q, ans) => {
    const { phase, ans: origAns } = followUpState;

    // Save state BEFORE any changes
    saveHistory(qaLog);

    if (phase === 1) {
      if (ans.label === "Ja" || ans.label === "Ja – Funktion gegeben" || (typeof ans === "string" && ans === "ja")) {
        if (origAns.followUpYesConclusion) {
          logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", "Ja", null, "", []);
          setFollowUpState(null);
          setConclusion({ text: origAns.followUpYesConclusion, type: origAns.followUpYesConclusionType || "ok" });
          setStep("report");
        } else if (origAns.followUpYesFollowUp2) {
          logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", "Ja", null, "", []);
          setFollowUpState({ phase: 2, ans: origAns, q });
        } else if (origAns.followUpYesNext) {
          logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", "Ja", null, "", []);
          setFollowUpState(null);
          setCurrentQId(origAns.followUpYesNext);
        }
      } else {
        if (origAns.followUpNoConclusion) {
          logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", "Nein", null, "", []);
          setFollowUpState(null);
          setConclusion({ text: origAns.followUpNoConclusion, type: origAns.followUpNoConclusionType || "warn" });
          setStep("report");
        } else if (origAns.followUpNoNext) {
          logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", "Nein", null, "", []);
          setFollowUpState(null);
          setCurrentQId(origAns.followUpNoNext);
        } else {
          logQA(origAns.followUpText || "Ist die Funktion jetzt gegeben?", "Nein", null, "", []);
          setFollowUpState(null);
          const nextId = getNextQId(q);
          if (nextId) setCurrentQId(nextId);
          else { setConclusion({ text: "Fehlerdiagnose abgeschlossen – Monteureinsatz planen", type: "warn" }); setStep("report"); }
        }
      }
    } else if (phase === 2) {
      if (ans.label === "Ja" || ans.label.startsWith("Ja")) {
        const res = origAns.followUpYesFollowUp2Yes;
        logQA(origAns.followUpYesFollowUp2Text, "Ja", null, "", []);
        setFollowUpState(null);
        if (res.conclusion) { setConclusion({ text: res.conclusion, type: res.conclusionType }); setStep("report"); }
        else if (res.next) setCurrentQId(res.next);
      } else {
        const res = origAns.followUpYesFollowUp2No;
        logQA(origAns.followUpYesFollowUp2Text, "Nein", null, "", []);
        setFollowUpState(null);
        if (res.conclusion) { setConclusion({ text: res.conclusion, type: res.conclusionType }); setStep("report"); }
        else if (res.next) setCurrentQId(res.next);
        else { const nextId = getNextQId(q); if (nextId) setCurrentQId(nextId); else { setConclusion({ text: "Fehlerdiagnose abgeschlossen – Monteureinsatz planen", type: "warn" }); setStep("report"); } }
      }
    }
  };

  const handlePhotoUpload = (e) => {
    const files = Array.from(e.target.files);
    files.forEach(f => {
      const reader = new FileReader();
      reader.onload = (ev) => setExtraPhotos(prev => [...prev, ev.target.result]);
      reader.readAsDataURL(f);
    });
  };

  const handleFinalAnswer = (q, ans) => {
    saveHistory(qaLog);
    // For last question with extraCode / extraPhoto
    logQA(q.text, ans.label, null, extraCode, extraPhotos);
    if (ans.conclusion) {
      setConclusion({ text: ans.conclusion, type: ans.conclusionType });
    } else {
      setConclusion({ text: "Fehlerdiagnose abgeschlossen – Monteureinsatz planen", type: "warn" });
    }
    setStep("report");
  };

  // ── Send report ──
  const buildMailBody = () => {
    const isEn = lang === "en";
    const devList = isEn ? DEVICES_EN : DEVICES;
    const devLabel = devList.find(d => d.id === deviceId)?.label || deviceId;
    const subLabel = subCat ? (subCat === "elektro" ? t("elektroLabel") : t("dieselLabel")) : "";
    const faultLabel = faultId === "sonstiger" ? t("sonstigerFehler") : (currentFault?.label || "");
    let body = isEn ? `FAULT REPORT – FINAL SUMMARY\n` : `STÖRUNGSANNAHME – ABSCHLUSSBERICHT\n`;
    body += `${isEn?"Date":"Datum"}: ${new Date().toLocaleString(isEn?"en-GB":"de-DE")}\n\n`;
    body += isEn ? `CUSTOMER DATA\n` : `KUNDENDATEN\n`;
    body += `${isEn?"Device No.":"Gerätenummer"}: ${customer.geraeteNr || (isEn?"(not specified)":"(nicht angegeben)")}\n`;
    body += `${isEn?"Name":"Name"}: ${customer.name}\n${isEn?"Company":"Firma"}: ${customer.firma}\n${isEn?"Location":"Einsatzort"}: ${customer.einsatzort}\n${isEn?"Phone":"Telefon"}: ${customer.telefon}\n\n`;
    body += isEn ? `DEVICE\n` : `GERÄT\n`;
    body += `${devLabel}${subLabel ? " – " + subLabel : ""} | ${isEn?"Fault type":"Störungstyp"}: ${faultLabel}\n\n`;
    body += isEn ? `DIAGNOSIS\n` : `DIAGNOSE\n`;
    qaLog.forEach((qa, i) => {
      body += `\n${isEn?"Question":"Frage"} ${i+1}: ${qa.questionText}\n${isEn?"Answer":"Antwort"}: ${qa.answerLabel}`;
      if (qa.actionTaken) body += `\n${isEn?"Action taken":"Maßnahme durchgeführt"}: ${qa.actionTaken}`;
      if (qa.errorCode) body += `\n${isEn?"Error code":"Fehlercode"}: ${qa.errorCode}`;
      if (qa.photos?.length > 0) body += `\n${isEn?"Photos":"Fotos"}: ${qa.photos.length} ${isEn?"image(s) attached":"Bild(er) angehängt"}`;
      body += "\n";
    });
    body += `\n${isEn?"RESULT":"ERGEBNIS"}: ${conclusion?.text || ""}`;
    if (bemerkung.trim()) body += `\n\n${isEn?"CUSTOMER REMARKS":"BEMERKUNG DES KUNDEN"}:\n${bemerkung}`;
    return body;
  };

  const handleSend = () => {
    if (!email.trim()) { showToast("Bitte E-Mail-Adresse eingeben"); return; }
    const body = buildMailBody();
    const subject = encodeURIComponent("Störungsannahme – Abschlussbericht");
    const bodyEnc = encodeURIComponent(body);
    window.open(`mailto:${email}?subject=${subject}&body=${bodyEnc}`);
    showToast("E-Mail-Client geöffnet ✓");
    setStep("send");
  };

  const resetAll = () => {
    setStep("customer"); setDeviceId(null); setSubCat(null); setFaultId(null);
    setQaLog([]); setConclusion(null); setFollowUpState(null);
    setExtraCode(""); setExtraPhotos([]); setEmail(""); setShowExtraInputs(false); setBemerkung(""); setQuestionHistory([]); setSonstigerText("");
    setCustomer({ geraeteNr:"", name:"", firma:"", einsatzort:"", telefon:"" });
  };

  const STEPS = ["lang","customer","device","subcategory","fault","sonstiger","questions","report","send"];
  const stepIdx = STEPS.indexOf(step);
  const progress = ((stepIdx + 1) / STEPS.length) * 100;

  // ── Render ──────────────────────────────────────────────────────────────
  return (
    <>
      <style>{CSS}</style>
      <div className="app-shell">
        <div className="app-header">
          <h1>{t("appTitle")}</h1>
          <p>{t("appSub")}</p>
        </div>

        <div className="progress-bar"><div className="progress-bar-fill" style={{width: progress+"%"}} /></div>

        {/* ── STEP: LANGUAGE ── */}
        {step === "lang" && (
          <div className="card" style={{textAlign:"center", padding:"3rem 2rem"}}>
            <h2 style={{marginBottom:"2rem"}}>{t("langSelect")}</h2>
            <div style={{display:"flex", gap:"1.5rem", justifyContent:"center", flexWrap:"wrap"}}>
              <div className="device-card" style={{width:"180px", padding:"2rem 1rem", cursor:"pointer"}}
                onClick={() => { setLang("de"); setStep("customer"); }}>
                <div style={{fontSize:"3.5rem", marginBottom:".8rem"}}>🇩🇪</div>
                <div className="label" style={{fontSize:"1.1rem"}}>Deutsch</div>
              </div>
              <div className="device-card" style={{width:"180px", padding:"2rem 1rem", cursor:"pointer"}}
                onClick={() => { setLang("en"); setStep("customer"); }}>
                <div style={{fontSize:"3.5rem", marginBottom:".8rem"}}>🇬🇧</div>
                <div className="label" style={{fontSize:"1.1rem"}}>English</div>
              </div>
            </div>
          </div>
        )}

        {/* ── STEP: CUSTOMER ── */}
        {step === "customer" && (
          <div className="card">
            <div className="step-label">{t("stepCustomer")}</div>
            <h2>{t("stepCustomerTitle")}</h2>
            <div className="field">
              <label>{t("geraeteNr")} <span style={{color:"var(--muted)", fontWeight:400}}>{t("geraeteNrOpt")}</span></label>
              <input type="text" placeholder="z. B. GL-12345" value={customer.geraeteNr}
                onChange={e => setCustomer(p => ({...p, geraeteNr: e.target.value}))} />
            </div>
            {[["name",t("name")],["firma",t("firma")],["einsatzort",t("einsatzort")],["telefon",t("telefon")]].map(([k,l]) => (
              <div className="field" key={k}>
                <label>{l} <span className="req">*</span></label>
                <input type={k==="telefon"?"tel":"text"} value={customer[k]}
                  onChange={e => { setCustomer(p => ({...p, [k]: e.target.value})); setErrors(prev => ({...prev, [k]:undefined})); }}
                  style={errors[k] ? {borderColor:"var(--warn)"} : {}} />
                {errors[k] && <div className="field-error">⚠ {t("pflichtfeld")}</div>}
              </div>
            ))}
            <div className="nav-row" style={{justifyContent:"space-between"}}>
              <button className="btn btn-outline" onClick={() => setStep("lang")}>🌐 {lang === "de" ? "Sprache" : "Language"}</button>
              <button className="btn btn-primary" onClick={() => { if (validateCustomer()) setStep("device"); }}>
                {t("weiter")}
              </button>
            </div>
          </div>
        )}

        {/* ── STEP: DEVICE ── */}
        {step === "device" && (
          <div className="card">
            <div className="step-label">{t("stepDevice")}</div>
            <h2>{t("stepDeviceTitle")}</h2>
            <div className="device-grid">
              {(lang === "en" ? DEVICES_EN : DEVICES).map(d => (
                <div key={d.id} className={`device-card${d.urgent?" urgent":""}`} onClick={() => selectDevice(d.id)}>
                  <div className="icon">{d.icon}</div>
                  <div className="label">{d.label}</div>
                  {d.code && <div className="code">{d.code}</div>}
                  {d.urgent && <span className="urgency-badge">{t("dringend")}</span>}
                </div>
              ))}
            </div>
            <div className="nav-row">
              <button className="btn btn-outline" onClick={() => setStep("customer")}>{t("zurueck")}</button>
            </div>
          </div>
        )}

        {/* ── STEP: SUBCATEGORY ── */}
        {step === "subcategory" && (
          <div className="card">
            <div className="step-label">{t("stepSub")}</div>
            <h2>{t("stepSubTitle")}</h2>
            <div className="sub-pills">
              {["elektro","diesel"].map(s => (
                <div key={s} className="pill" onClick={() => { setSubCat(s); setStep("fault"); }}>
                  {t(s)}
                </div>
              ))}
            </div>
            <div className="nav-row">
              <button className="btn btn-outline" onClick={() => setStep("device")}>{t("zurueck")}</button>
            </div>
          </div>
        )}

        {/* ── STEP: FAULT TYPE ── */}
        {step === "fault" && qs && (
          <div className="card">
            <div className="step-label">{deviceId==="GS"||deviceId==="GGGT" ? t("stepFault4") : t("stepFault3")}</div>
            <h2>{t("stepFaultTitle")}</h2>
            <div className="fault-list">
              {qs.faults.map((f, i) => (
                <div key={f.id} className="fault-item" onClick={() => { setFaultId(f.id); startFault(f.id); }}>
                  <span className="fault-num">{i+1}</span>
                  {f.label}
                </div>
              ))}
              <div className="fault-item" onClick={() => { setFaultId("sonstiger"); setSonstigerText(""); setExtraPhotos([]); setStep("sonstiger"); }}>
                <span className="fault-num" style={{background:"#e8e4dc", color:"var(--muted)"}}>✎</span>
                {t("sonstigerFehler")}
              </div>
            </div>
            <div className="nav-row">
              <button className="btn btn-outline" onClick={() => { if (deviceId==="GS"||deviceId==="GGGT") setStep("subcategory"); else setStep("device"); }}>{t("zurueck")}</button>
            </div>
          </div>
        )}

        {/* ── STEP: SONSTIGER FEHLER ── */}
        {step === "sonstiger" && (
          <div className="card">
            <div className="step-label">{t("sonstigerFehler")}</div>
            <h2>{t("stepSonstigerTitle")}</h2>
            <p className="muted" style={{marginBottom:"1.2rem"}}>{t("stepSonstigerSub")}</p>
            <div className="field">
              <label>{t("fehlerbeschreibung")} <span className="req">*</span></label>
              <textarea placeholder={t("fehlerbeschreibungPH")} value={sonstigerText}
                onChange={e => setSonstigerText(e.target.value)} rows={5}
                style={{width:"100%",padding:".65rem .9rem",border:"1.5px solid var(--border)",borderRadius:"var(--radius)",fontFamily:"inherit",fontSize:".9rem",background:"var(--bg)",color:"var(--text)",resize:"vertical",outline:"none"}}/>
            </div>
            <div className="field">
              <label>{t("fotosHochladen")} <span style={{color:"var(--muted)",fontWeight:400}}>{t("fotosOpt")}</span></label>
              <button className="btn btn-outline btn-sm" style={{marginTop:".3rem"}} onClick={() => photoRef.current?.click()}>{t("fotosHochladen")}</button>
              <input ref={photoRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={handlePhotoUpload}/>
              {extraPhotos.length > 0 && <div className="img-preview" style={{marginTop:".5rem"}}>{extraPhotos.map((src,i) => <img key={i} src={src} alt="foto" className="img-thumb"/>)}</div>}
            </div>
            <div className="nav-row">
              <button className="btn btn-outline" onClick={() => setStep("fault")}>{t("zurueck")}</button>
              <button className="btn btn-primary" disabled={!sonstigerText.trim()} onClick={() => {
                setQaLog([{questionText: lang==="en" ? "Fault description (Other fault)" : "Fehlerbeschreibung (Sonstiger Fehler)", answerLabel:sonstigerText, actionTaken:null, errorCode:"", photos:extraPhotos}]);
                setConclusion({text: lang==="en" ? "Other fault – final report created" : "Sonstiger Fehler – Abschlussprotokoll erstellt", type:"warn"});
                setStep("report");
              }}>{t("berichtErstellen")}</button>
            </div>
          </div>
        )}

        {/* ── STEP: QUESTIONS ── */}
        {step === "questions" && currentQ && (
          <div>
            <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:".8rem"}}>
              <div className="step-label" style={{margin:0}}>
                {t("stoerungstyp")}: <strong>{currentFault?.label}</strong>
                {deviceId==="urgent" && <span className="urgency-badge">{t("dringend")}</span>}
              </div>
              <button className="btn btn-outline btn-sm" onClick={goBack}>{t("zurueck")}</button>
            </div>

            {/* Previous Q&A log */}
            {qaLog.length > 0 && (
              <div className="card" style={{background:"var(--surface2)", padding:"1rem 1.2rem"}}>
                <div className="muted" style={{marginBottom:".5rem", fontWeight:600}}>{t("bisherigeAntworten")}</div>
                {qaLog.map((qa, i) => (
                  <div key={i} style={{marginBottom:".4rem", fontSize:".84rem"}}>
                    <span style={{color:"var(--muted)"}}>F{i+1}:</span> {qa.questionText} → <strong>{qa.answerLabel}</strong>
                    {qa.actionTaken && <span style={{color:"#27ae60"}}> ✓ {qa.actionTaken}</span>}
                    {qa.errorCode && <span style={{color:"var(--accent)"}}> | Code: {qa.errorCode}</span>}
                  </div>
                ))}
              </div>
            )}

            {/* Current question */}
            {!followUpState && (
              <div className="question-block">
                <div className="question-text">{currentQ.text}</div>

                {/* Photo-only upload questions (e.g. Undichtigkeit) – show upload + answer buttons directly */}
                {(currentQ.extraPhoto && !currentQ.extraCode) ? (
                  <>
                    <div className="extra-area">
                      <button className="btn btn-outline btn-sm" onClick={() => photoRef.current?.click()}>📷 Fotos hochladen</button>
                      <input ref={photoRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={handlePhotoUpload} />
                      {extraPhotos.length > 0 && (
                        <div className="img-preview">
                          {extraPhotos.map((src, i) => <img key={i} src={src} alt="foto" className="img-thumb" />)}
                        </div>
                      )}
                    </div>
                    <div className="answer-btns" style={{marginTop:"1rem"}}>
                      {currentQ.answers.map((ans, i) => {
                        const isJa = ans.label.startsWith("Ja");
                        const isNein = ans.label.startsWith("Nein") || ans.label.startsWith("Ohne") || ans.label.startsWith("Continue");
                        const cls = isJa ? "ja" : isNein ? "nein" : "other";
                        return (
                          <button key={i} className={`ans-btn ${cls}`} onClick={() => handleFinalAnswer(currentQ, ans)}>{ans.label}</button>
                        );
                      })}
                    </div>
                  </>

                ) : (currentQ.extraCode || currentQ.extraPhoto) ? (
                  /* Display-error questions: show Ja/Nein first, then inputs only after Ja */
                  <>
                    {!showExtraInputs && (
                      <div className="answer-btns">
                        <button className="ans-btn ja" onClick={() => setShowExtraInputs(true)}>Ja</button>
                        <button className="ans-btn nein" onClick={() => {
                          logQA(currentQ.text, "Nein", null, "", []);
                          const neinAns = currentQ.answers.find(a => a.label.startsWith("Nein"));
                          if (neinAns?.conclusion) { setConclusion({ text: neinAns.conclusion, type: neinAns.conclusionType }); setStep("report"); }
                        }}>Nein</button>
                      </div>
                    )}
                    {showExtraInputs && (
                      <>
                        <div className="extra-area">
                          {currentQ.extraCode && (
                            <input type="text" placeholder={t("fehlercodePH")} value={extraCode}
                              onChange={e => setExtraCode(e.target.value)} />
                          )}
                          {currentQ.extraPhoto && (
                            <>
                              <button className="btn btn-outline btn-sm" onClick={() => photoRef.current?.click()}>{t("fotosHochladen")}</button>
                              <input ref={photoRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={handlePhotoUpload} />
                              {extraPhotos.length > 0 && (
                                <div className="img-preview">
                                  {extraPhotos.map((src, i) => <img key={i} src={src} alt="foto" className="img-thumb" />)}
                                </div>
                              )}
                            </>
                          )}
                        </div>
                        <div style={{marginTop:"1rem"}}>
                          <button className="btn btn-primary" onClick={() => {
                            const jaAns = currentQ.answers.find(a => a.label.startsWith("Ja"));
                            handleFinalAnswer(currentQ, jaAns || currentQ.answers[1]);
                            setShowExtraInputs(false);
                          }}>{t("diagnoseAbschliessen")}</button>
                        </div>
                      </>
                    )}
                  </>

                ) : (
                  /* Normal questions */
                  <div className="answer-btns">
                    {currentQ.answers.map((ans, i) => {
                      const isJa = ans.label.startsWith("Ja");
                      const isNein = ans.label.startsWith("Nein");
                      const cls = isJa ? "ja" : isNein ? "nein" : "other";
                      return (
                        <button key={i} className={`ans-btn ${cls}`} onClick={() => handleAnswer(currentQ, ans)}>{ans.label}</button>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* Follow-up state */}
            {followUpState && followUpState.phase === 1 && (
              <div className="question-block">
                <div className="action-banner">
                  <strong>{t("massnahmeDurchfuehren")}</strong>
                  {followUpState.ans.action}
                  {followUpState.ans.actionBtn && (
                    <div style={{marginTop:".5rem"}}>
                      <button className="btn btn-outline btn-sm">✓ {followUpState.ans.actionBtn}</button>
                    </div>
                  )}
                </div>
                <div className="question-text" style={{marginTop:"1rem"}}>
                  {followUpState.ans.followUpText || "Ist die Funktion jetzt gegeben?"}
                </div>
                <div className="answer-btns">
                  <button className="ans-btn ja" onClick={() => handleFollowUpAnswer(followUpState.q, {label:"Ja"})}>Ja</button>
                  <button className="ans-btn nein" onClick={() => handleFollowUpAnswer(followUpState.q, {label:"Nein"})}>Nein</button>
                </div>
              </div>
            )}

            {followUpState && followUpState.phase === 2 && (
              <div className="question-block">
                <div className="question-text">{followUpState.ans.followUpYesFollowUp2Text}</div>
                <div className="answer-btns">
                  <button className="ans-btn ja" onClick={() => handleFollowUpAnswer(followUpState.q, {label:"Ja"})}>Ja</button>
                  <button className="ans-btn nein" onClick={() => handleFollowUpAnswer(followUpState.q, {label:"Nein"})}>Nein</button>
                </div>
              </div>
            )}
          </div>
        )}

        {/* ── STEP: REPORT ── */}
        {step === "report" && (
          <div className="card">
            <div className="step-label">{t("reportTitle")}</div>
            <h2>{t("diagnoseAbgeschlossen")}</h2>

            {conclusion && (
              <div className={`conclusion-banner ${conclusion.type}`} style={{marginBottom:"1.5rem"}}>
                {conclusion.type === "warn" ? "⚠ " : "✓ "}{conclusion.text}
              </div>
            )}

            <div className="report-section">
              <h3>{t("kundendaten")}</h3>
              <div className="report-row"><span className="report-label">Gerätenummer</span><span className="report-val">{customer.geraeteNr || "–"}</span></div>
              <div className="report-row"><span className="report-label">Name</span><span className="report-val">{customer.name}</span></div>
              <div className="report-row"><span className="report-label">Firma</span><span className="report-val">{customer.firma}</span></div>
              <div className="report-row"><span className="report-label">Einsatzort</span><span className="report-val">{customer.einsatzort}</span></div>
              <div className="report-row"><span className="report-label">Telefon</span><span className="report-val">{customer.telefon}</span></div>
            </div>

            <div className="report-section">
              <h3>{t("geraet")}</h3>
              <div className="report-row"><span className="report-label">{t("geraetetyp")}</span><span className="report-val">{DEVICES.find(d=>d.id===deviceId)?.label}</span></div>
              {subCat && <div className="report-row"><span className="report-label">{t("antrieb")}</span><span className="report-val">{subCat === "elektro" ? t("elektroLabel") : t("dieselLabel")}</span></div>}
              <div className="report-row"><span className="report-label">{t("stoerungstyp")}</span><span className="report-val">{faultId === "sonstiger" ? "Sonstiger Fehler" : currentFault?.label}</span></div>
            </div>

            <div className="report-section">
              <h3>{t("diagnoseprotokoll")}</h3>
              {qaLog.map((qa, i) => (
                <div key={i} style={{marginBottom:".9rem", paddingBottom:".9rem", borderBottom:"1px dotted var(--border)"}}>
                  <div className="report-row"><span className="report-label">{t("frage")} {i+1}</span><span className="report-val">{qa.questionText}</span></div>
                  <div className="report-row"><span className="report-label">{t("antwort")}</span><span className="report-val"><strong>{qa.answerLabel}</strong></span></div>
                  {qa.actionTaken && <div className="report-row"><span className="report-label">{t("massnahme")}</span><span className="report-val" style={{color:"#27ae60"}}>{qa.actionTaken}</span></div>}
                  {qa.errorCode && <div className="report-row"><span className="report-label">{t("fehlercode")}</span><span className="report-val">{qa.errorCode}</span></div>}
                  {qa.photos?.length > 0 && (
                    <div className="report-row">
                      <span className="report-label">{t("fotos")}</span>
                      <div className="img-preview">{qa.photos.map((src,j) => <img key={j} src={src} alt="foto" className="img-thumb" />)}</div>
                    </div>
                  )}
                </div>
              ))}
            </div>

            <div className="report-section">
              <h3>{t("ergebnis")}</h3>
              <div className={`conclusion-banner ${conclusion?.type}`}>{conclusion?.type==="ok"?"✓ ":"⚠ "}{conclusion?.text}</div>
            </div>

            {bemerkung.trim() && (
              <div className="report-section">
                <h3>{t("bemerkungenTitle")}</h3>
                <div style={{background:"var(--surface2)", border:"1px solid var(--border)", borderRadius:"var(--radius)", padding:"1rem", fontSize:".9rem", lineHeight:"1.6", whiteSpace:"pre-wrap"}}>{bemerkung}</div>
              </div>
            )}

            <div style={{marginTop:"1.5rem"}}>
              <label>{t("bemerkungen")} <span style={{color:"var(--muted)", fontWeight:400}}>{t("bemerkungenOpt")}</span></label>
              <textarea
                placeholder={t("bemerkungenPH")}
                value={bemerkung}
                onChange={e => setBemerkung(e.target.value)}
                rows={4}
                style={{marginTop:".3rem", width:"100%", padding:".65rem .9rem", border:"1.5px solid var(--border)", borderRadius:"var(--radius)", fontFamily:"inherit", fontSize:".9rem", background:"var(--bg)", color:"var(--text)", resize:"vertical", outline:"none"}}
              />
            </div>

            <div style={{marginTop:"1.5rem"}}>
              <label>{t("sendAn")} <span className="req">*</span></label>
              <input type="email" placeholder="kundendienst@firma.de" value={email}
                onChange={e => setEmail(e.target.value)} style={{marginTop:".3rem"}} />
            </div>

            <div className="nav-row">
              <button className="btn btn-outline" onClick={goBack}>{t("zurueck")}</button>
              <button className="btn btn-outline" onClick={resetAll}>{t("neueMeldung")}</button>
              <button className="btn btn-success" onClick={handleSend}>{t("berichtSenden")}</button>
            </div>
          </div>
        )}

        {/* ── STEP: SEND DONE ── */}
        {step === "send" && (
          <div className="card" style={{textAlign:"center", padding:"3rem 2rem"}}>
            <div style={{fontSize:"3rem", marginBottom:"1rem"}}>✅</div>
            <h2>{t("sendDoneTitle")}</h2>
            <p className="muted" style={{margin:"1rem 0"}}>{t("sendDoneSub")} <strong>{email}</strong> {t("sendDoneSub2")}</p>
            <button className="btn btn-primary" style={{marginTop:"1rem"}} onClick={resetAll}>{t("neueStorung")}</button>
          </div>
        )}

        {toast && <div className="toast">{toast}</div>}
      </div>
    </>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
